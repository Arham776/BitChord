# Gradle daemon needs a JDK. If JAVA_HOME is unset and no system java exists,
# scripts fall back to Android Studio's bundled JetBrains Runtime.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

kotlin.code.style=official

# Don't fail builds on machines missing some Kotlin/Native targets.
kotlin.native.ignoreDisabledTargets=true
