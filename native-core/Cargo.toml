[package]
name = "native-core"
version = "0.1.0"
edition = "2021"
description = "BitChord native core: analyzer + decode/mix playback engine behind one UniFFI boundary (spec sections 2 and 3)."

[lib]
name = "native_core"
crate-type = ["staticlib", "cdylib", "rlib"]

# UniFFI ships no published bindgen CLI crate; the official route is a bin in
# your own crate calling uniffi::uniffi_bindgen_main(). Version match with the
# uniffi crate is automatic. required-features keeps cross-compilation of the
# staticlib free of the CLI feature; run it via scripts/build-native-core.sh.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
# One FFI boundary for Swift and Kotlin bindings (spec §2).
uniffi = "0.32"
log = "0.4"
env_logger = "0.11"

# §3.1 Decoder — enabled after the milestone-4 format-coverage spike. Feature
# list mirrors the container/codec matrix the spec calls out: FLAC, MP3,
# AAC/M4A, ALAC, Vorbis, PCM/WAV, AIFF. Milestone-4 gate result (§3.4):
# symphonia 0.6 ships no Opus codec; the app mirrors upstream's own
# `pickAac`/`isM4a` preference so playback targets AAC/MP4 renditions, and
# Opus-in-WebM decode is the documented residual gap (libopus bindings if a
# source only ever offers Opus).
symphonia = { version = "0.6.1", default-features = false, features = [
  "flac", "mp3", "aac", "alac", "vorbis", "pcm", "wav", "ogg", "isomp4", "mkv", "aiff",
] }

# §3.1 audio output — CoreAudio backend on Apple.
cpal = "0.18"

# §4 tagging + local-library metadata reads (milestone 9, pulled early because
# LocalMusicView needs real tags to be a working app).
lofty = "0.25"

# §3.1 StreamingReader — blocking HTTP client behind a background fetch thread.
# native-tls uses the system TLS (Secure Transport on Apple) so the TLS
# fingerprint matches what googlevideo expects — rustls gets 403'd.
ureq = { version = "2", features = ["native-tls"] }

# Mixer plumbing: control→render commands and the real-time output ring.
crossbeam-channel = "0.5"
rtrb = "0.3"

# ONNX inference for Automix (Beat This! + open-unmix). Pure-Rust runtime so
# the same staticlib links on macOS, iOS, and the iOS simulator — no extra
# onnxruntime xcframework. Same graphs upstream ships; rten is the engine.
rten = "0.26"
rten-tensor = "0.26"

# No build.rs needed: the proc-macro route (#[uniffi::export] + setup_scaffolding!)
# replaces the UDL/uniffi-build setup.

# Apple only: the render thread's QoS class. The mixer answers a real-time
# deadline — the device callback drains its ring on a schedule the hardware sets
# — so a mixer that can be scheduled below the app work competing with it
# underruns, and an underrun is a dropout. Nothing outside this crate needs it.
#
# Kept last deliberately: a `[target.…]` table ends the `[dependencies]` table
# it follows, so anything written after one of these silently becomes a
# target-specific dependency instead.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
